<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="dbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E131F"/>
      <stop offset="50%" stop-color="#141B2D"/>
      <stop offset="100%" stop-color="#0B0E17"/>
    </linearGradient>
    <linearGradient id="dbGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5A36"/>
      <stop offset="50%" stop-color="#FFA845"/>
      <stop offset="100%" stop-color="#FF3621"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#FFF2A3"/>
      <stop offset="100%" stop-color="#AA771C"/>
    </linearGradient>
  </defs>
  
  <rect width="1200" height="800" fill="url(#dbBg)"/>
  <rect x="30" y="30" width="1140" height="740" rx="16" fill="none" stroke="url(#goldBorder)" stroke-width="3" opacity="0.6"/>
  <rect x="45" y="45" width="1110" height="710" rx="12" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  
  <!-- Header Logo & Issuer -->
  <g transform="translate(600, 140)" text-anchor="middle">
    <path d="M -40 -30 L 0 -50 L 40 -30 L 40 10 L 0 30 L -40 10 Z" fill="none" stroke="url(#dbGold)" stroke-width="4"/>
    <path d="M -20 -15 L 0 -25 L 20 -15 L 20 5 L 0 15 L -20 5 Z" fill="url(#dbGold)" opacity="0.7"/>
    <text y="65" font-family="'Courier New', monospace" font-size="18" font-weight="bold" fill="#FF5A36" letter-spacing="6">DATABRICKS ACADEMY</text>
    <text y="95" font-family="'Georgia', serif" font-size="14" fill="#94A3B8" letter-spacing="3">OFFICIAL CERTIFICATION CREDENTIAL</text>
  </g>
  
  <!-- Certificate Title -->
  <g transform="translate(600, 310)" text-anchor="middle">
    <text y="0" font-family="'Helvetica Neue', sans-serif" font-size="15" fill="#64748B" letter-spacing="4">THIS IS TO CERTIFY THAT</text>
    <text y="55" font-family="'Georgia', serif" font-size="44" font-weight="bold" fill="#F8FAFC" letter-spacing="2">SHREYAS B J</text>
    <line x1="-280" y1="75" x2="280" y2="75" stroke="url(#goldBorder)" stroke-width="1.5" opacity="0.5"/>
    <text y="115" font-family="'Helvetica Neue', sans-serif" font-size="15" fill="#94A3B8" letter-spacing="2">has successfully demonstrated proficiency and is certified as a</text>
    <text y="165" font-family="'Helvetica Neue', sans-serif" font-size="28" font-weight="bold" fill="#FBBF24" letter-spacing="1">Machine Learning Engineer Associate</text>
    <text y="200" font-family="'Courier New', monospace" font-size="14" fill="#38BDF8" letter-spacing="2">APACHE SPARK &#8226; MLFLOW &#8226; LAKEHOUSE PLATFORM</text>
  </g>
  
  <!-- Verification Seal & Footer -->
  <g transform="translate(600, 640)" text-anchor="middle">
    <circle cx="-320" cy="0" r="45" fill="none" stroke="url(#goldBorder)" stroke-width="2"/>
    <circle cx="-320" cy="0" r="38" fill="rgba(212,175,55,0.08)"/>
    <text x="-320" y="5" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#F59E0B" letter-spacing="1">VERIFIED</text>
    
    <text x="0" y="-10" font-family="'Courier New', monospace" font-size="12" fill="#64748B">Credential ID: CERT-DB-ML-2026</text>
    <text x="0" y="15" font-family="'Courier New', monospace" font-size="12" fill="#64748B">Valid: Oct 2026 - Oct 2028 &#8226; Authenticity Protected</text>
    
    <circle cx="320" cy="0" r="45" fill="none" stroke="#FF5A36" stroke-width="2"/>
    <text x="320" y="5" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#FF5A36" letter-spacing="1">DATABRICKS</text>
  </g>
</svg>