<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="gmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08101E"/>
      <stop offset="50%" stop-color="#0E192E"/>
      <stop offset="100%" stop-color="#050A14"/>
    </linearGradient>
    <linearGradient id="gmGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4285F4"/>
      <stop offset="33%" stop-color="#9B72CB"/>
      <stop offset="66%" stop-color="#D96570"/>
      <stop offset="100%" stop-color="#F4B400"/>
    </linearGradient>
    <linearGradient id="gmBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>
  
  <rect width="1200" height="800" fill="url(#gmBg)"/>
  <rect x="30" y="30" width="1140" height="740" rx="16" fill="none" stroke="url(#gmGrad)" stroke-width="3" opacity="0.7"/>
  <rect x="45" y="45" width="1110" height="710" rx="12" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  
  <!-- Header Logo & Issuer -->
  <g transform="translate(600, 140)" text-anchor="middle">
    <!-- 4-point star of Google Gemini -->
    <path d="M 0 -35 Q 0 0 35 0 Q 0 0 0 35 Q 0 0 -35 0 Q 0 0 0 -35 Z" fill="url(#gmGrad)"/>
    <text y="70" font-family="'Courier New', monospace" font-size="18" font-weight="bold" fill="#38BDF8" letter-spacing="6">GOOGLE CLOUD</text>
    <text y="98" font-family="'Georgia', serif" font-size="14" fill="#94A3B8" letter-spacing="3">GENERATIVE AI DEVELOPER NETWORK</text>
  </g>
  
  <!-- Certificate Title -->
  <g transform="translate(600, 310)" text-anchor="middle">
    <text y="0" font-family="'Helvetica Neue', sans-serif" font-size="15" fill="#64748B" letter-spacing="4">THIS IS TO CERTIFY THAT</text>
    <text y="55" font-family="'Georgia', serif" font-size="44" font-weight="bold" fill="#F8FAFC" letter-spacing="2">SHREYAS B J</text>
    <line x1="-280" y1="75" x2="280" y2="75" stroke="url(#gmGrad)" stroke-width="1.5" opacity="0.6"/>
    <text y="115" font-family="'Helvetica Neue', sans-serif" font-size="15" fill="#94A3B8" letter-spacing="2">has successfully completed hands-on project verification for</text>
    <text y="165" font-family="'Helvetica Neue', sans-serif" font-size="30" font-weight="bold" fill="#38BDF8" letter-spacing="1">Build With Gemini</text>
    <text y="200" font-family="'Courier New', monospace" font-size="14" fill="#A78BFA" letter-spacing="2">MULTIMODAL AI &#8226; VERTEX AI &#8226; GEMINI PRO INTERFACES</text>
  </g>
  
  <!-- Verification Seal & Footer -->
  <g transform="translate(600, 640)" text-anchor="middle">
    <circle cx="-320" cy="0" r="45" fill="none" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="-320" cy="0" r="38" fill="rgba(56,189,248,0.08)"/>
    <text x="-320" y="5" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#38BDF8" letter-spacing="1">VERIFIED</text>
    
    <text x="0" y="-10" font-family="'Courier New', monospace" font-size="12" fill="#64748B">Credential ID: CERT-GCP-GEM-2026</text>
    <text x="0" y="15" font-family="'Courier New', monospace" font-size="12" fill="#64748B">Issued: Oct 2026 &#8226; Google Developer Program</text>
    
    <circle cx="320" cy="0" r="45" fill="none" stroke="#A78BFA" stroke-width="2"/>
    <text x="320" y="5" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#A78BFA" letter-spacing="1">GOOGLE AI</text>
  </g>
</svg>