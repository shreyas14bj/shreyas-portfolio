<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="clBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140D0C"/>
      <stop offset="50%" stop-color="#1F1514"/>
      <stop offset="100%" stop-color="#0E0807"/>
    </linearGradient>
    <linearGradient id="clTerra" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="50%" stop-color="#CC5500"/>
      <stop offset="100%" stop-color="#E07A5F"/>
    </linearGradient>
    <linearGradient id="clGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  
  <rect width="1200" height="800" fill="url(#clBg)"/>
  <rect x="30" y="30" width="1140" height="740" rx="16" fill="none" stroke="url(#clGold)" stroke-width="3" opacity="0.6"/>
  <rect x="45" y="45" width="1110" height="710" rx="12" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  
  <!-- Header Logo & Issuer -->
  <g transform="translate(600, 140)" text-anchor="middle">
    <!-- Asterisk symbol of Anthropic -->
    <path d="M 0 -35 L 0 35 M -30 -18 L 30 18 M -30 18 L 30 -18" stroke="url(#clTerra)" stroke-width="6" stroke-linecap="round"/>
    <text y="70" font-family="'Courier New', monospace" font-size="18" font-weight="bold" fill="#F59E0B" letter-spacing="6">ANTHROPIC</text>
    <text y="98" font-family="'Georgia', serif" font-size="14" fill="#A8A29E" letter-spacing="3">CLAUDE DEVELOPER ECOSYSTEM</text>
  </g>
  
  <!-- Certificate Title -->
  <g transform="translate(600, 310)" text-anchor="middle">
    <text y="0" font-family="'Helvetica Neue', sans-serif" font-size="15" fill="#78716C" letter-spacing="4">THIS IS TO CERTIFY THAT</text>
    <text y="55" font-family="'Georgia', serif" font-size="44" font-weight="bold" fill="#FAFAF9" letter-spacing="2">SHREYAS B J</text>
    <line x1="-280" y1="75" x2="280" y2="75" stroke="url(#clGold)" stroke-width="1.5" opacity="0.5"/>
    <text y="115" font-family="'Helvetica Neue', sans-serif" font-size="15" fill="#A8A29E" letter-spacing="2">has completed professional certification demonstrating competency as</text>
    <text y="165" font-family="'Helvetica Neue', sans-serif" font-size="28" font-weight="bold" fill="#FBBF24" letter-spacing="1">Claude Certified Developer - Foundations</text>
    <text y="200" font-family="'Courier New', monospace" font-size="14" fill="#34D399" letter-spacing="2">AGENTIC WORKFLOWS &#8226; MULTI-TURN REASONING &#8226; SYSTEM PROMPTING</text>
  </g>
  
  <!-- Verification Seal & Footer -->
  <g transform="translate(600, 640)" text-anchor="middle">
    <circle cx="-320" cy="0" r="45" fill="none" stroke="url(#clGold)" stroke-width="2"/>
    <circle cx="-320" cy="0" r="38" fill="rgba(245,158,11,0.08)"/>
    <text x="-320" y="5" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#F59E0B" letter-spacing="1">VERIFIED</text>
    
    <text x="0" y="-10" font-family="'Courier New', monospace" font-size="12" fill="#78716C">Credential ID: CERT-ANTH-01-2026</text>
    <text x="0" y="15" font-family="'Courier New', monospace" font-size="12" fill="#78716C">Valid: Aug 2026 - Aug 2027 &#8226; Issued by Anthropic</text>
    
    <circle cx="320" cy="0" r="45" fill="none" stroke="#D97706" stroke-width="2"/>
    <text x="320" y="5" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#D97706" letter-spacing="1">FOUNDATIONS</text>
  </g>
</svg>